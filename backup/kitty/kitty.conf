# ==============================================================================
# Hyprdark - Kitty GPU Terminal Configuration
# High-performance, low-latency, cybernetic styling with Zsh integration.
# ==============================================================================

# Font Configuration
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        13.0

# Window Dimensions & Spacing
window_padding_width 8 10
placement_strategy   center
hide_window_decorations yes
confirm_os_window_close 0

# Visual Transparency (Subtle depth)
background_opacity 0.94

# Default Shell (Zsh)
shell /usr/bin/zsh

# Cursor Customization
cursor_shape beam
cursor_blink_interval 0.5
cursor_stop_blinking_after 15.0

# Scrollback Buffer
scrollback_lines 20000

# Mouse Interaction
url_color #00e5ff
url_style curly
open_url_with default
detect_urls yes

# Audio Bell (Muted)
enable_audio_bell no
visual_bell_duration 0.0

# Tab Bar Appearance
tab_bar_edge top
tab_bar_style powerline
tab_powerline_style slanted
active_tab_font_style bold
active_tab_foreground   #0d0e15
active_tab_background   #e63946
inactive_tab_foreground #7a829e
inactive_tab_background #151722

# Load Color Theme
include theme.conf
